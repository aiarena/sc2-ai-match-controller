[package]
name = "k8s_controller"
version.workspace = true
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "^1.0.68"
base64 = "0.22"
config = { version = "0.14", default-features = false, features = ["toml", "json"] }
k8s-openapi = { version = "0.28.0", default-features = false, features = ["v1_30"] }
kube = {  version = "1.1.0", default-features = false, features = ["client", "runtime", "rustls-tls"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23.31", features = ["ring"] }
serde = {  version = "^1.0" }
serde_json = "1.0.87"
serde_yaml = "0.9.16"
tokio = {version = "1.0", features = ["fs", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-appender = "0.2.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

