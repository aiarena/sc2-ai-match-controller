[package]
name = "k8s_controller"
version.workspace = true
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
base64 = "0.22"
config = { version = "0.14", default-features = false, features = ["toml", "json"] }
# kube 2.x and k8s-openapi 0.26 are the latest versions supporting v1_30 our cluster at v1.30.13+k3s1.
k8s-openapi = { version = "0.26", default-features = false, features = ["v1_30"] }
kube = { version = "2", default-features = false, features = ["client", "runtime", "rustls-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1" }
serde_json = "1"
serde_yml = "0.0"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
