RUN_TYPE = "prepare"    # "prepare" to download match assets, "submit" to submit match result
KEEP_ALIVE = false      # Keep container alive after match (useful in Kubernetes/Docker Compose)

LOGGING_LEVEL = "debug" # info, debug, error, trace
LOG_ROOT = "/logs"

BOT_DIRECTORY = "/bots"
GAME_DIRECTORY = "/game"

API_TOKEN = ""          # API token to retrieve matches and submit results
BASE_WEBSITE_URL = ""   # AI Arena website URL; leave empty to use local match files instead

MATCHES_FILE = ""       # Path to local match request file (used when BASE_WEBSITE_URL is empty)
RESULTS_FILE = ""       # Path to local results file (used when BASE_WEBSITE_URL is empty)

CACHING_SERVER_URL = "http://aiarena-caching-nodeport-service"
