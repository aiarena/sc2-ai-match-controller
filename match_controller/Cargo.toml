[package]
name = "match_controller"
version.workspace = true
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
config = { version = "0.14", default-features = false, features = ["toml"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"
tokio = { version = "1", features = ["fs", "time", "macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry", "env-filter"] }
url = "2"
