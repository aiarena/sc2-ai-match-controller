[package]
name = "sc2_controller"
version.workspace = true
authors.workspace = true
edition = "2021"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
async-process = "2"
axum = { version = "0.8", features = ["ws"] }
config = { version = "0.14", default-features = false, features = ["toml"] }
futures-util = "0.3"
indexmap = { version = "2", features = ["serde"] }
once_cell = "1"
parking_lot = { version = "0.12" }
protobuf = "=3.7.2"
sc2-proto = { git = "https://github.com/aiarena/sc2-proto-rs.git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"
tokio = { version = "1", features=["fs", "macros", "rt-multi-thread", "signal"] }
tokio-tungstenite = "0.30"
tower = { version = "0.5", features=["timeout"] }
tower-http = { version = "0.7", features=["trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry", "env-filter"] }
utoipa = { version = "5", features = ["axum_extras"], optional = true }
utoipa-swagger-ui = { version = "9", features = ["axum"], optional = true }

[features]
swagger = ["utoipa", "utoipa-swagger-ui"]
